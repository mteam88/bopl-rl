name: guard
on:
  push:
  pull_request:
jobs:
  no-game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: whole tree
        run: scripts/check-game-data.sh --tree HEAD
      - name: pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: scripts/check-game-data.sh --range "${{ github.event.before }}..${{ github.sha }}"
      - name: pull request
        if: github.event_name == 'pull_request'
        run: scripts/check-game-data.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
