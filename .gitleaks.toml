# The default rules, plus an allowlist for the league's rating-condition keys
# ("key": "sim<hash>.<loadouts>.<maps>.t<ticks>.d<delay>"), which match the
# generic API key rule but are identifiers.
[extend]
useDefault = true

[[allowlists]]
description = "league rating-condition keys"
condition = "AND"
paths = ['''^league/league\.json$''']
regexes = ['''^sim[0-9a-f]{8}\.[a-z0-9.-]+$''']
