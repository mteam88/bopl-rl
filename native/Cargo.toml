[package]
name = "bopl-sim"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# Bit-exact Q32.32 reference arithmetic (Unity's BoplFixedMath) for the golden
# verification tooling. The default `Fix` is an f64 behind the same API.
q32 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
