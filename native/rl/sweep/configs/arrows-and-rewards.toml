# First real sweep: learning rate, entropy schedule, kill/timeout rewards and
# the buttons-head entropy scale, scored by the anchor ladder (mean win rate vs
# random/initial and any frozen opponents in the evaluation results).
#
# Prepared, not launched. Before launching:
#   1. Wait for the box: run this only when bopl-long-run-1b-007 (or its
#      successor) is not training, or halve the workers.
#   2. Optional but recommended: freeze run 007's final checkpoint as an anchor:
#        create native/artifacts/rl/sweeps/anchors/opponents.json (schema 2,
#        entries name/path/sha256/metadata_sha256 - see evaluation_protocol.py)
#        pointing at .../007-s73-1b-free-rows/checkpoints/policy-<final>.bin,
#        then uncomment evaluation_opponents below. The anchor scorer picks up
#        every opponent group in the results automatically (scripted bots too,
#        once the native evaluator grows them).
#
# Budget: trials sweep 20M-100M learner steps (Protein spends ~80% of trials
# at lower cost and expands ~20% toward the 100M cap). At ~50k learner/s on a
# free box a 100M trial is ~35 min plus ~3 min of evaluations; the expected
# mix (mostly 25-60M trials) averages ~20 min, so max_runs = 60 is roughly a
# day of wall clock. While another run shares the box, double that.
#
# gamma: train.py has no --gamma flag (the native default from bopl.ini stays
# fixed); add a flag to train.py first if gamma should join the sweep.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "percentile"  # anchor score is a win rate in 0..1
downsample = 5
early_stop_quantile = 0.3
max_suggestion_cost = 1.2e8        # cost = learner_steps
max_runs = 60
use_gpu = false                    # GP on CPU; cuda:0 belongs to training
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "10G"
nice = 10
max_seconds = 5400                 # ~90 min hard wall per trial
poll_seconds = 60
min_early_stop_fraction = 0.2

[scoring]
scorer = "anchors"
opponents = []                     # every non-selfplay opponent present
include_heldout = false

[fixed]
steps = 100000000                  # seed-trial budget = the 100M cap
workers = 16
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learning_rate = 3e-4
entropy = 0.01
entropy_floor = 0.004              # capped to entropy/2 when entropy sweeps lower
entropy_half_life = 150000000
entropy_head_scale = "1,1,1"
entropy_free_rows = 1
reward_kill = 0.1
reward_timeout = -1
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 1000000
eval_every = 5000000               # up to 20 anchor points per 100M trial
evaluation_games = 8
heldout_games = 4
frozen_games = 8
evaluation_workers = 2
cudagraphs = 1
# evaluation_opponents = "native/artifacts/rl/sweeps/anchors/opponents.json"

[params.steps]
distribution = "log_normal"
min = 2e7
max = 1e8
scale = "time"

[params.learning_rate]
distribution = "log_normal"
min = 5e-5
max = 2e-3
scale = 0.5

[params.entropy]
distribution = "log_normal"
min = 2e-3
max = 3e-2
scale = 0.5

[params.entropy_half_life]
distribution = "log_normal"
min = 1e7
max = 3e8
scale = 0.5
integer = true

[params.reward_kill]
distribution = "uniform"
min = 0.0
max = 0.5
scale = "auto"

[params.reward_timeout]
distribution = "uniform"
min = -2.0
max = 0.0
scale = "auto"

[params.head_scale_buttons]
distribution = "log_normal"
min = 0.25
max = 8.0
scale = 0.5
