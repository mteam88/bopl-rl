# Overnight sweep 7 (2026-09-13): overnight-6's 1B protocol with the Fourier aim head.
# Score: Bradley-Terry Elo vs pool v5 (unchanged; game_mismatch=true on every rating
# is informational, see overnight-5.toml), IQM over the last 3 evaluations, 480 games
# per checkpoint. Fourier checkpoints carry aim_fourier in the sidecar, so the pool
# rater and the dashboard read them unchanged.
#
# Why: the aim-head study (main fa60e0b, sweeps/aim-ar-fourier/report.md; 4 arms +
# K sweep x 3 seeds x 200M at overnight-6 trial-002 settings) found --aim-fourier K
# (circular Fourier parameterisation of the 256 aim logits, 1+2K decoder columns)
# beats the absolute-bin head on every pre-registered metric, monotonically as K
# shrinks to a plateau at K=1..4: K=4 at 200M = hit rate 0.087 vs 0.025, median
# aim change 15.5 vs 46.6 deg, Elo 575 vs 377, same learner throughput. K=1..3
# are within seed noise of K=4 (545/485/507); K=4 keeps the Elo tiebreak and is
# fixed here. --aim-ar (buttons-then-aim) lost everywhere and halved sps; not used.
# 575 at 200M equals overnight-6's best trial at 1B, so the absolute-bin aim head
# was the binding constraint and this sweep re-tunes around the new head.
#
# Budget: as overnight-6 (1B, w128 b4, eval_every 40M): 20.7 min per trial measured
# over 36 trials -> 36 trials ~ 12.5 h.
#
# Space (6 params, 1 default + 8 Sobol + 27 GP), from overnight-6's 36 trials:
#   learning_rate  corr -0.57, every GP trial pinned at the 5e-4 floor -> 2e-4..8e-4.
#   reward_kill    corr +0.58, GP at 0.50-0.57 against the 0.6 cap -> 0.3..1.0.
#   entropy        corr +0.55, GP at 0.020-0.028 -> 1.2e-2..5e-2.
#   head_scale_aim corr +0.24, GP at 0.34-0.57; with the Fourier head the aim
#                  distribution is smooth so the scale may matter less -> 0.15..1.0.
#   entropy_half_life  GP at 390-460M -> 2.5e8..8e8.
#   scripted_share_max/min replace overnight-6's time decay: Elo matchmaking
#   over the default 14-entry roster (v2 easy/medium/hard + search-medium/hard).
#   scripted_banks stays 1 (the last bank draws from the roster).
# Sobol kept at 8: the new head can move the lr/entropy optimum, so the box is
# widened around overnight-6's cell rather than shrunk onto it.
# Trial 000 = overnight-6's 028 + aim_fourier 4: the direct "what does the head buy
# at 1B" comparison (028 = 575 with absolute bins). The parent finalises the
# share-min/max boxes; values here only have to validate.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"     # Elo, not a rate
downsample = 3                     # = [scoring].last_k points per trial
fixed_cost = true
max_suggestion_cost = 1.01e9
max_runs = 36                      # 6 params: 1 default + 8 Sobol + 27 GP, ~12.5 h
num_random_samples = 8
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "6G"
nice = 10
max_seconds = 4800                 # a healthy trial is ~21 min
poll_seconds = 60

[scoring]
scorer = "reference"
pool = "native/artifacts/rl/sweeps/anchors/pool-v5/pool.json"
last_k = 3                         # eval_every 40M -> the last 120M steps
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 70001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
steps = 1000000000
workers = 128
buffers = 4
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learner_passes = 4
aim_fourier = 4                    # the aim-head study's pick; 0 = absolute bins (overnight-1..6)
learning_rate = 5e-4
entropy = 2.48e-2
entropy_floor = 0.001
entropy_half_life = 447000000
entropy_head_scale = "0.41,1.5,1"
entropy_free_rows = 1
reward_kill = 0.52
reward_timeout = -1
scripted_roster = "default"        # 14-entry v2+search roster, one bank
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 20000000
eval_every = 40000000
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

[params.learning_rate]
distribution = "log_normal"
min = 2e-4
max = 8e-4                         # overnight-6 pinned at its 5e-4 floor
scale = 0.5

[params.entropy]
distribution = "log_normal"
min = 1.2e-2
max = 5e-2
scale = 0.5

[params.entropy_half_life]
distribution = "log_normal"
min = 2.5e8
max = 8e8
scale = 0.5
integer = true

[params.reward_kill]
distribution = "uniform"
min = 0.3
max = 1.0                          # overnight-6 pressed on its 0.6 cap
scale = "auto"

[params.scripted_share_max]
distribution = "log_normal"
min = 0.02
max = 0.5
scale = 0.5
default = 0.15

[params.scripted_share_min]
distribution = "log_normal"
min = 0.005
max = 0.1
scale = 0.5
default = 0.02

[params.head_scale_aim]
distribution = "log_normal"
min = 0.15
max = 1.0
scale = 0.5
default = 0.41
