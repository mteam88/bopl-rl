# Plumbing check for overnight-1.toml on the Rust backend: two 2M-step trials
# with scripted banks, a decay, bot evaluation groups and the 007 anchors.
# Run with BOPL_RL_BACKEND=rust; ~5 minutes.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "percentile"
downsample = 2
fixed_cost = true
early_stop = false
max_suggestion_cost = 3e6
max_runs = 2
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "14G"
nice = 10
max_seconds = 1800
poll_seconds = 15

[scoring]
scorer = "anchors"
opponents = ["mixed-hard", "archer-hard", "pursuer-hard", "evasive-hard", "mixed-medium",
             "run007-100m", "run007-300m", "run007-final"]
include_heldout = false

[fixed]
steps = 2000000
workers = 256
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learner_passes = 1
learning_rate = 3e-4
entropy = 0.01
entropy_floor = 0.001
entropy_half_life = 150000000
entropy_head_scale = "1,1,1"
entropy_free_rows = 1
reward_kill = 0.1
reward_timeout = -1
scripted_bots = ["mixed", "archer"]
scripted_level = "hard"
scripted_decay = 1500000
scripted_opponents = "mixed-hard,archer-hard,pursuer-hard,evasive-hard,mixed-medium"
evaluation_opponents = "native/artifacts/rl/sweeps/anchors/opponents.json"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 1000000
eval_every = 1000000
evaluation_games = 8
heldout_games = 4
frozen_games = 8
evaluation_workers = 4
cudagraphs = 1

[params.scripted_banks]
distribution = "int_uniform"
min = 0
max = 2
scale = "auto"
default = 2

[params.scripted_level_index]
distribution = "int_uniform"
min = 0
max = 2
scale = "auto"

[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 1e-3
scale = 0.5
