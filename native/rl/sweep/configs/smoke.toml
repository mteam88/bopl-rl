# Plumbing check for overnight-4.toml at a tiny budget: one 6M-step trial with
# the mixed-v2 bank, three evaluations, the reference scorer (three ratings
# vs pool v3) and the behaviour flags. ~6 minutes on a quiet box. Numbers are
# noise at this scale; the point is suggest -> launch -> score -> observe ->
# report. Run it outside the artifacts tree:
#   native/artifacts/rl/venv/bin/python native/rl/sweep/driver.py \
#     --config native/rl/sweep/configs/smoke.toml --root /tmp/sweeps

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"
downsample = 3
fixed_cost = true
max_suggestion_cost = 7e6
max_runs = 1
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "6G"
nice = 10
max_seconds = 1800
poll_seconds = 15

[scoring]
scorer = "reference"
pool = "native/artifacts/rl/sweeps/anchors/overnight-3-v3/pool.json"
last_k = 3
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 70001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
steps = 6000000
workers = 128
buffers = 4
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learner_passes = 4
learning_rate = 1.25e-3
entropy = 8e-3
entropy_floor = 0.001
entropy_half_life = 200000000
entropy_head_scale = "1,1.5,1"
entropy_free_rows = 1
reward_kill = 0.27
reward_timeout = -1
scripted_bots = ["mixed-v2"]
scripted_level = "hard"
scripted_decay = 120000000
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 2000000
eval_every = 2000000
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

[params.learning_rate]
distribution = "log_normal"
min = 8e-4
max = 2e-3
scale = 0.5

[params.reward_kill]
distribution = "uniform"
min = 0.1
max = 0.5
scale = "auto"
