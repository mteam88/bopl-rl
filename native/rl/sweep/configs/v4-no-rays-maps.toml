# Policy v4, more maps (POLICY_V4_PLAN.md 7d, claim 3): v4-no-rays-maps
#   The geometry-channel control of v4-aim-maps: writer bits 2|8 = fan and terrain
#   block off, aim ray and line of sight kept (v4-aim-only's rows), so the two runs
#   differ only in the egocentric geometry. Same split, seed and budget. Otherwise:
#   v4-aim (rays + aim/LOS, writer bit 8, the production shape) trained on 23 of the
#   31-level catalogue (native/data/map-set.json): maps 0-2 plus 20 new grass levels;
#   held out: 3-4 (continuity with the five-map runs) plus six new levels (RL
#   8, 10, 17, 19, 23, 29 = levels 10, 14, 49, 68, 73, 90), one or two per platform-count
#   stratum at the stratum's median width. The held-out list is fixed here and never
#   enters training_map_mask. Scored on pool v7 exactly as every other v4 run (its
#   members trained on 0-2; the scorer plays the pool's maps), plus the held-out band:
#   scripted-bot win rate on the held-out maps and the trained-minus-held-out gap
#   (flags.py heldout_gap, readout.py section 3), flagged above 8 points.
#   In-run evaluation keeps its budget: 12 training maps x 2 games (was 3 x 8) and
#   8 held-out maps x 2 games (was 2 x 4), every 80M steps.
#   Everything else is v4-aim verbatim (024's recipe, seed 73, 1.73B steps).
# Flags not listed are layout.V4_DEFAULTS.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"
downsample = 3
fixed_cost = true
max_suggestion_cost = 1.75e9
max_runs = 1
num_random_samples = 1
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "10G"
nice = 0
max_seconds = 21600                # steps stay 1734936776 (the 024 budget); the comparison is at equal steps (every 20M checkpoint), not equal wall time, so full runs are wanted even at 3x
poll_seconds = 60

[scoring]
scorer = "reference"
pool = "native/artifacts/rl/sweeps/anchors/pool-v7/pool.json"
last_k = 3
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 80001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"
heldout-gap = "heldout_gap > 8"

[fixed]
# policy v4 (POLICY_V4_PLAN.md), width 256, one MinGRU layer; shape flags below
encoder = "v4"
hidden = 256
layers = 1
v4_ablate = 10
# overnight-9 024, verbatim
steps = 1734936776
workers = 128
buffers = 4
banks = 4
seed = 73
horizon = 128
learner_passes = 4
aim_fourier = 4
learning_rate = 0.0003431012662975937
entropy = 0.01532588085540654
entropy_floor = 0.001
entropy_half_life = 718611646
entropy_head_scale = "0.028821467398601395,1.5,1"
entropy_free_rows = 1
reward_kill = 0.2883693237829292
reward_timeout = -1
scripted_roster = "default"
scripted_banks = 3
scripted_share_max = 1.0
scripted_share_min = 0.11048204896277423
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2, 5, 6, 7, 9, 11, 12, 13, 14, 15, 16, 18, 20, 21, 22, 24, 25, 26, 27, 28, 30]
evaluation_maps = [0, 1, 2, 5, 7, 11, 13, 15, 18, 21, 24, 26]
heldout_maps = [3, 4, 8, 10, 17, 19, 23, 29]
episode_ticks = 7200
checkpoint_every = 20000000
eval_every = 80000000
evaluation_games = 2
heldout_games = 2
evaluation_workers = 4
cudagraphs = 1

# sweep_config requires one swept parameter; at its default this is [fixed].learning_rate.
[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5
default = 0.0003431012662975937
