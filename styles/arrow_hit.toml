# Arrow hits (style-discovery/kills bow_arrow_impact): each arrow that lands.
name = "arrow_hit"
kits = [[3, 2, 4]]  # in l1's lineups (league_loop.py keeps only kits main trains on)
fade = { start = 0.0, end = 0.7 }

[[term]]
name = "hit"
when = "self.arrow_hits > prev(self.arrow_hits)"
value = "0.05 * (self.arrow_hits - prev(self.arrow_hits))"
