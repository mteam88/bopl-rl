# Offense: early kill premium at 0.5 (offense_kill.toml at the premium the 2026-10-19 replan set for
# the off1 factorial, factor I1). Paid to the killer only, never mirrored as a death penalty, for each
# credited kill before sudden death (episode tick 6960): 0.5 at 0 s falling linearly to 0 at sudden
# death. With reward_kill 0.288 a credited win at kickoff is worth up to 1.79 instead of 1.29; a win by
# the opponent's own fall stays 1.0. Permanent: train with --style-fade-steps 1000000000000000000.
name = "offense_kill_05"
fade = { start = 0.999, end = 1.0 }

[[term]]
name = "early_kill"
on = "death"
when = "ev.actor == self and ev.subject != self"
value = "0.5 * max(0, 1 - now / 6960)"
