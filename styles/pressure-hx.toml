# Pressure for the human-style exploiter (2026-10-15, copy of pressure.toml with its kits): stay within striking range of a
# living opponent, and kill early - a kill is worth more the sooner it lands
# (full at 0 s, nothing from 120 s, when sudden death starts). With
# --reward-timeout -1 a timeout is a loss, so waiting the opponent out never pays.
name = "pressure-hx"
kits = [[2, 4, 14], [2, 3, 26], [10, 11, 14], [2, 3, 11], [2, 24, 30], [7, 10, 11], [3, 6, 30]]  # learner kits of lineups-human-exploiter.txt
fade = { start = 0.0, end = 0.7 }

[[term]]
name = "close"
when = "self.alive and alive(opp) and dist(self, opp) < 12"
value = "8e-5 * dt"

[[term]]
name = "early_kill"
on = "death"
when = "ev.actor == self and ev.subject != self"
value = "0.1 * max(0, 1 - now / 7200)"
