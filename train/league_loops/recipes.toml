# Main-exploiter recipes for league loops with [evals] decide (train/league_loop.py).
# Each new main exploiter takes the next entry (cycling): warm start from the newest
# main, --loadout-learner-first on `loadout_set` (first half = the exploiter's kit,
# second = main's), `reward_timeout`, and `styles` as one style program faded over
# `timeout` learner steps (default [loop] main_exploiter_timeout). `train` may add
# train.py flags. The loop re-reads this file at every reset: append, never reorder
# (the loop's position is an index into this list).
#
# Seeded from native/artifacts/rl/sweeps/anticamp/train.sh (2026-10-15), the runs that
# became anticamp-camper-1000m (camper-1) and anticamp-punisher-4000m (punisher-2).

[[recipe]]
name = "camper"
loadout_set = "native/data/lineups-anticamp-camper.txt"
reward_timeout = 0
styles = ["styles/camp_keepaway.toml"]

[[recipe]]
name = "punisher"
loadout_set = "native/data/lineups-anticamp-punisher2.txt"
reward_timeout = -1
styles = ["styles/pressure.toml", "styles/punish_spent_mobility.toml", "styles/arrow_hit.toml"]

# exploiters-2 (2026-10-15, native/artifacts/rl/sweeps/exploiters-2): f5 fine-tunes against frozen f5,
# kits from eval/kit_sweep.py and the g111/matthew16 leads. f5's side of each lineup: the mirror,
# Matthew's 16 combos and random kits. Budgets are learner steps; failed recipes are not listed here
# (see train/league_loops/recipes-tried.toml).

[[recipe]]
name = "missile"   # x2-missile-1500m: +0.176 [+0.123,+0.230] over f5's own play on these kits; still +0.01/100M at 750M
loadout_set = "native/data/lineups-x2-missile.txt"
reward_timeout = 0
styles = []        # shrink_safe_area was tried and almost never fired on these kits: plain win reward
timeout = 1000000000

[[recipe]]
name = "drill-grenade"   # x2-drill-1500m: +0.286 [+0.215,+0.357] over f5's own play on Dash/Drill/Grenade kits; ~plateau at 750M
loadout_set = "native/data/lineups-x2-drillgrenade.txt"   # trained on lineups-x2-drill.txt; its third kit, Drill/Platform/Gust, did not improve
reward_timeout = 0
styles = ["styles/drill_snipe.toml"]
timeout = 1000000000

[[recipe]]
name = "trap"   # x2-trap-1500m: +0.155 [+0.100,+0.210] over f5's own play on these kits; +0.01/100M at 750M
loadout_set = "native/data/lineups-x2-trap.txt"
reward_timeout = 0
styles = ["styles/trap_kill.toml"]   # fired ~2e-6 per decision: in effect plain win reward
timeout = 1000000000

[[recipe]]
name = "gold-dash"   # x2-gold-1500m: +0.112 [+0.061,+0.163] over f5's own play on Gold mushroom/Dash/Bow (fresh-seed confirmation); plateau by ~450M
loadout_set = "native/data/lineups-x2-golddash.txt"   # trained on lineups-x2-gold.txt; its other two Gold mushroom kits did not improve
reward_timeout = 0
styles = ["styles/punish_low_offense.toml"]
timeout = 1000000000
