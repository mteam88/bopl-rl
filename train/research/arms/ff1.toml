# Screening factorial (REVIEW-2026-10-cursor.md Section 4, levels per LITERATURE-2026-10.md and the
# findings log's prioritized-replay entry): a 2^(6-1) design, F = ABCDE (resolution VI: main effects
# and two-factor interactions all clean; the half-fraction that holds the all-low cell ff-1, the l2
# config E0 replicates), 32 runs in shuffled order, 6B constant + 1B anneal, 2000 games per endpoint,
# about 96 GPU-h. Every run carries the 5B half-life EMA (decay per arm), so EMA - raw is a within-run
# contrast. To halve the cost at resolution IV (main effects clean, interactions aliased in pairs):
# generators = { E = "ABC", F = "BCD" }, 16 runs, also holding ff-1.
name = "ff1"
purpose = "screen"
init = "native/artifacts/rl/league-loops/l2/main/checkpoints/policy-136002994176.bin"
constant_steps = 6_000_000_000
anneal_steps = 1_000_000_000
games = 2000
gpu_mib = 10500   # E+ arms need ~10.2 GB: the whole card
exclude_opponents = ["final5-18666m", "anneal20-26666m", "team5b-6250m", "g111-20b-26027m"]

[factorial]
seed = 401
generators = { F = "ABCDE" }
order_seed = 1

[factorial.factors.A]   # LR
high = { learning-rate = 1.21e-4 }

[factorial.factors.B]   # gamma
high = { gamma = 0.998 }

[factorial.factors.C]   # entropy (buttons/hold get 1.5x/1x of it, aim 0.0288x)
high = { entropy = 0.005, entropy-floor = 0.005 }

[factorial.factors.D]   # PFSP weighting: (1-x)^3 vs the variance weighting x(1-x)
high = { pfsp-f = "var" }

# Batch per optimizer step: 24576 decisions vs 49152 (2x), the largest that fits. The literature's 8x
# (--horizon 512 --minibatch-div 1, 196608) does not: memory grows with workers x horizon. Peak MiB
# measured 2026-10-18 at 8/16 workers, extrapolated linearly to 256 (control: 8102 predicted, 8156 real):
# h128 div2 8.1 GB, h128 div1 10.2 GB, h256 div2 15.8 GB; h256 div1 and h512 failed even at 8-16 workers.
[factorial.factors.E]
high = { minibatch-div = 1 }

# Prioritized replay: alpha 0.8 (the l2 config) vs 0, uniform sampling. Every arm is one fresh run per
# stage, so beta ramps 0.2 -> 0.84 the same way in all of them (and again in each anneal).
[factorial.factors.F]
high = { prio-alpha = 0 }

# Optional G, Muon decoupled weight decay (w -= lr * wd * w per optimizer step), once train.py has the
# flag. 0.02 at lr 2.43e-4 shrinks 4.9e-6 per step, one e-fold per ~5B learner steps (about one over
# the 6B arm); 0.1 would be six, too strong for a warm start. Half as much at A+ and at E+ (half the
# steps). Seven factors in 32 runs at resolution IV: generators = { F = "ABC", G = "-BCDE" }.
# [factorial.factors.G]
# high = { weight-decay = 0.02 }
