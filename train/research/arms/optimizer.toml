# Optimizer screen (PLAN-2026-10 stage 3, "Adam is safe"; literature review: Muon weight decay). Muon at
# constant LR 2.43e-4 moves the weights a fixed RMS 0.090 x LR per update (2 optimizer steps at
# --minibatch-div 2); Adam's steady state is 0.26 x LR, so 3e-4 Adam steps 3.6x Muon's size and the
# step-matched Adam LR is 2.43e-4 x 0.090 / 0.26 = 8.4e-5 (smoke runs 2026-10-19, 24 workers,
# sweeps/adam-opt). One seed each, paired by seed with e0's l2 control (s301).
#
# Anneal floors keep the control's floor ratio (1.2e-5 / 2.43e-4 = 0.049) for Adam at 3e-4 and the
# matched step size for matched Adam (1.2e-5 x 0.346). Adam restarts cold at the anneal's
# --init-weights, as Muon's momentum does.
name = "optimizer"
purpose = "screen"
init = "native/artifacts/rl/league-loops/l2/main/checkpoints/policy-136002994176.bin"
constant_steps = 6_000_000_000
anneal_steps = 1_000_000_000
checkpoint_every = 2_000_000_000
raw_at = [2_000_000_000]
exclude_opponents = ["final5-18666m", "anneal20-26666m", "team5b-6250m", "g111-20b-26027m"]
seeds = [301]

[arm.adam-3e4]
flags = { optimizer = "adam", learning-rate = 3e-4 }
anneal_floor_lr = 1.48e-5
compare = "l2"

[arm.adam-matched]
flags = { optimizer = "adam", learning-rate = 8.4e-5 }
anneal_floor_lr = 4.2e-6
compare = "l2"

# Decoupled weight decay at the value that holds the main's weight norm (growth 0.53/B at
# 40.7k optimizer steps/B): about 0.9% norm shrink over the 6B screen, so this arm mostly checks
# harmlessness before the loop adopts it.
[arm.muon-wd]
flags = { weight-decay = 1.5e-4 }
compare = "l2"

# Muon on the trunk, AdamW on the embedding and output heads (actor, critic_out) at 1e-4: Muon
# gave those tensors 0.11-0.23 x LR per update, AdamW gives 0.26-0.31 x its LR.
[arm.muon-adamw]
flags = { optimizer = "muon-adamw", adam-lr = 1e-4 }
compare = "l2"
