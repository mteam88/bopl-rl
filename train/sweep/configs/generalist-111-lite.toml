# The first generalist, lite writer: the control for generalist-111.toml.
# Identical to it in every flag but one, v4_ablate 10 - the aim ray and the line
# of sight to the enemy on an otherwise empty terrain channel, no terrain block
# and no 32-ray fan. That is the writer every one of the eight specialists used,
# and it won the sweep that froze the recipe (v4-lite-aim) - but that sweep ran
# on three maps and one fixed kit, where there is little terrain to perceive and
# a smaller observation learns faster. This pair asks whether that still holds
# across 111 topologies, which is the question the whole condition turns on.
#
# Read the two together: score and heldout-13 transfer. If lite wins again, the
# terrain block and the ray fan are not carrying their weight and the next
# generalist keeps the lite writer. If it loses, the recipe that produced the
# specialists is the wrong base for anything past three maps, which matters more
# than this run.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"
downsample = 3
fixed_cost = true
max_suggestion_cost = 7.0e9
max_runs = 1
num_random_samples = 1
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "10G"
nice = 0
max_seconds = 54000                # 15 h. The full writer runs at ~220k learner/s, not the
                                   # specialists' ~630k, so this arm needs ~8.7 h and the old
                                   # 30000 (8.3 h) would have killed it at ~96% - measured on
                                   # the live run 2026-09-24, not estimated. Both arms carry the
                                   # same cap so [trial] never differs between them.
poll_seconds = 60

[scoring]
scorer = "reference"
pool = "native/artifacts/rl/sweeps/anchors/pool-v8/pool.json"
last_k = 3
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 80001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
# policy v4, width 256, one MinGRU layer; shape flags below
encoder = "v4"
hidden = 256
layers = 1
v4_set_inner = 64
v4_ffn_dim = 0
v4_critic_dim = 384
v4_ablate = 10                     # THE VARIABLE: aim ray + line of sight only (see generalist-111.toml)
# the loadout draw (this run): the eight canonical mirror lineups, both players
# on the same kit every episode, which is what makes the condition symmetric
loadout_set = "native/data/lineups-8.txt"
mirror_share = 1.0
# overnight-9 024, stretched 4x in steps and every step-denominated schedule
steps = 6939869184                 # 4 x 1734967296 (the 1x runs' realised step count)
workers = 256                      # b4 recipe: 128 rows per buffer chain
buffers = 4
banks = 4
seed = 73
horizon = 128
learner_passes = 1
minibatch_div = 2
aim_fourier = 4
learning_rate = 0.0004852184640654399
entropy = 0.01532588085540654
entropy_floor = 0.001
entropy_half_life = 2874446584     # 4 x 718611646
entropy_head_scale = "0.028821467398601395,1.5,1"
entropy_free_rows = 1
reward_kill = 0.2883693237829292
reward_timeout = -1
scripted_roster = "default"
scripted_banks = 3
scripted_share_max = 1.0
scripted_share_min = 0.11048204896277423
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
opponents = "self"
training_maps = "training-111"
evaluation_maps = [0, 1, 2]        # the in-run progress curve, kept on the specialists' maps
heldout_maps = "heldout-13"        # 9 grass, 3 snow, 1 space: the transfer reading
episode_ticks = 7200
checkpoint_every = 80000000        # 4 x 20M: the same ~87 checkpoints per run
eval_every = 320000000             # 4 x 80M: the same ~22 evaluations per run
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

# sweep_config requires one swept parameter; at its default this is [fixed].learning_rate.
[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5
default = 0.0004852184640654399   # must equal [fixed].learning_rate
