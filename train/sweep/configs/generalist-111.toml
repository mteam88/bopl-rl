# The first generalist: every training map, Matthew's fifteen kits played against
# each other. The frozen specialist recipe (v4-lite-aim, w256 b4, LR 4.852e-4, seed
# 73, the 4x budget) with the condition changed - the map set becomes the 111
# training maps instead of 0,1,2, each seat draws its own kit from Matthew's fifteen
# instead of one fixed kit, and games run to 3 min so sudden death is played out.
# The optimiser settings are those of train/sweep/configs/drill-throw-magnet-long.toml.
#
# The observation is the one open question, and generalist-111-lite.toml is its
# control: this file trains with the full v4 writer (terrain block + 32-ray fan
# + aim ray), the lite file with v4_ablate 10 (aim ray and line of sight only,
# no terrain block and no fan) which is what every specialist used and what won
# the sweep that chose the recipe - on three maps and one kit, where terrain
# perception buys little. Across 111 topologies it plausibly buys a lot. The
# pair settles it; arguing about it does not. It is not a cheap pair: the full
# writer measured ~220k learner/s against the lite writer's ~630k, so this arm
# is ~8.7 h and the control ~3.1 h. That asymmetry is the cost of the writer,
# and it is itself part of the answer - a small win for the full writer is not
# worth 2.8x the wall clock per step.
#
# --opponents self in both, deliberately. League members exist and PFSP would
# draw them, but all eight were trained at v4_ablate 10 and registry.opponents
# refuses a member whose architecture differs from the run's, so the full-writer
# run cannot have them. Giving them to the lite run only would confound the one
# variable under test. The generalist joins the league by being rated against it
# afterwards, and the first exploiter aimed at it is the natural first use of
# --opponents <name>.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"
downsample = 3
fixed_cost = true
max_suggestion_cost = 7.0e9
max_runs = 1
num_random_samples = 1
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "10G"
nice = 0
max_seconds = 54000                # 15 h. The full writer runs at ~220k learner/s, not the
                                   # specialists' ~630k, so this arm needs ~8.7 h and the old
                                   # 30000 (8.3 h) would have killed it at ~96% - measured on
                                   # the live run 2026-09-24, not estimated. Both arms carry the
                                   # same cap so [trial] never differs between them.
poll_seconds = 60

[scoring]
scorer = "league"
last_k = 3
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 80001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
# policy v4, width 256, one MinGRU layer; shape flags below
encoder = "v4"
hidden = 256
layers = 1
v4_set_inner = 64
v4_ffn_dim = 0
v4_critic_dim = 384
v4_ablate = 0                      # THE VARIABLE: full writer (see generalist-111-lite.toml)
# the loadout draw (this run): each seat draws its own kit from Matthew's fifteen
# (lineups-matthew, Revival held back), so 14 games in 15 are two different kits.
# A 3-id file lists kits, not games (resolve_loadouts expands it to all 225
# ordered pairs); an earlier attempt at mirror_share 1 only ever played a kit
# against itself. 2,2,20 holds Dash twice on purpose: no loadout_no_dup.
loadout_set = "native/data/lineups-matthew.txt"
mirror_share = 0.0
# overnight-9 024, stretched 4x in steps and every step-denominated schedule
steps = 6939869184                 # 4 x 1734967296 (the 1x runs' realised step count)
workers = 256                      # b4 recipe: 128 rows per buffer chain
buffers = 4
banks = 4
seed = 73
horizon = 128
learner_passes = 1
minibatch_div = 2
aim_fourier = 4
learning_rate = 0.0004852184640654399
entropy = 0.01532588085540654
entropy_floor = 0.001
entropy_half_life = 2874446584     # 4 x 718611646
entropy_head_scale = "0.028821467398601395,1.5,1"
entropy_free_rows = 1
reward_kill = 0.2883693237829292
reward_timeout = -1
# No scripted training banks. The bots address fixed ability slots, not abilities
# (bopl_bots.h: "Scripted opponents for the Dash/Bow/Platform loadout"), so on seven of
# this run's eight kits "archer" charges a bow that is not in slot 1. The first attempt
# gave them three of the four banks and spent 3.0B of its steps on opponents that were
# pressing arbitrary buttons; killed at 33% on 2026-09-24 rather than finish it. All four
# banks now hold the run's own snapshots, which play whatever kit they are dealt.
# Evaluation still reports the bots, on the kit they were written for (evaluate.py).
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
opponents = "self"
training_maps = "training-111"
evaluation_maps = [0, 1, 2]        # the in-run progress curve, kept on the specialists' maps
heldout_maps = "heldout-13"        # 9 grass, 3 snow, 1 space: the transfer reading
episode_ticks = 10800              # 3 min. The game starts sudden death at 2 min
                                   # (GameSessionHandler TimeBeforeSuddenDeath = 120), so the old
                                   # 7200 cut every close game off as a draw right where it is
                                   # decided - 17.5% of strong games in tournament-20260917.
checkpoint_every = 80000000        # 4 x 20M: the same ~87 checkpoints per run
eval_every = 320000000             # 4 x 80M: the same ~22 evaluations per run
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

# sweep_config requires one swept parameter; at its default this is [fixed].learning_rate.
[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5
default = 0.0004852184640654399   # must equal [fixed].learning_rate
