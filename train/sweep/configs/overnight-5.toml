# Overnight sweep 5 (2026-09-12): overnight-4's space on the 8x trainer.
# Score: Bradley-Terry Elo vs pool v5 (random, 4 v1 hard bots + mixed-medium,
# 4 v2 hard bots, search-hard/medium, 6 overnight-3 finals, run007-final),
# IQM over the last 3 evaluations, 480 games per checkpoint (240 gave a 95% CI
# of +-45 Elo on the overnight-3 re-score; trial effects there were ~30-50).
# Pool v5 was played on libbopl_sim.so d0a170e5. The trainer sim is now
# 50fc427b (lto=fat, target-cpu=native, fdlibm sine; the
# sine is the only trajectory change and evaluate.py replayed 216/217 games
# identically), so every rating carries game_mismatch=true; that flag is
# informational and the pool stays v5 (its ratings moved within CI between
# v3, v4 and v5 with no tier change, so a v6 rebuild would only reshuffle
# noise). (Pools were later replaced by the league.)

#
# Budget (measured 2026-09-12, main 15b5339, w128 b4): 1.15M learner steps/s
# on an idle box (bench_shape.sh), 815k with the 20M-step evaluations running
# alongside (sanity/final-w128: 150M in 184 s, 8 evaluations of 217 games at
# 13-25 s each). A 400M trial is ~8 min of training + ~2 min of scoring
# (3 checkpoints x 480 games, 8 workers), so 60 trials fill ~10 h; the
# 2026-09-11 trainer needed 51 min per trial and overnight-4 only got 4 + 1
# trials done across two launches (469/402/452/450 at aim scale 1; the
# aim-0.15 trial 000 was stopped at 294M with aim entropy 2.4 nats vs 4.9 and
# hit rate 4.7-7.2% vs 4.0-5.1% at 213-266M). Same shape as overnight-4
# (128 workers, 4 buffers, 400M) so its trials stay comparable and the
# aim A/B is re-run as trial 000 here. w256 b4 is 18% faster but changes the
# batch; kept for a later sweep. num_random_samples 12: 1 default + 12 Sobol
# + 47 GP trials over 7 parameters.
#
# Space: overnight-3 (47 trials) converged from trial 017 on to lr 1.1-1.4e-3,
# 4 learner passes, entropy 7.4-10e-3, half-life pinned at its 1.5e8 cap,
# buttons scale 1.1-2.0, reward_kill 0.22-0.30 (pinned near the 0.3 cap),
# scripted_banks 1, scripted_decay 44-76M. Fixed: learner_passes 4,
# head_scale_buttons 1.5. Swept: lr and entropy around the basin (entropy
# widened downward now that the aim head no longer soaks up the bonus);
# half-life and reward_kill past their overnight-3 caps; decay rescaled to
# the 400M run; the curriculum, scripted_banks 1-3 over the ordered
# candidates evasive-v2, mixed-v2, pursuer-v2 (the ladder rates the v2 bots
# ~250 Elo above every overnight-3 final; Matthew went 9-6 vs evasive-v2-hard
# and 18-6 vs mixed-v2-hard in the real game on 2026-09-11); and
# head_scale_aim. Trial 000 = the basin centre, one bank, aim scale 0.15.
#
# Aim: overnight-4's first trial 000 (aim scale 1) kept the 256-way aim head
# at 4.5-5.5 nats of entropy for all 400M steps (uniform = 5.55; buttons and
# hold collapse to ~0.2 within 50M): arrows fly in ~90 equally likely
# directions, hit rate 1-7% flat, all 28 kills in the final eval were the 28
# hits, and 56 of 84 wins came from platform squishes/ledge-offs instead. The
# aim head has ~2x the max entropy of the others, so at scale 1 it collects
# most of the entropy bonus. head_scale_aim is swept log-uniform 0.03-1.
#
# Bots: the training bank plays mixed-v2-hard, not mixed-hard. v1 bots lost
# 66% of their games to platform squishes (loss taxonomy),
# the exploit the no-offense trials learned; v2 cut squishes 221->29 and rates
# 592 Elo vs 342 at equal cost. Evaluations play mixed-hard (overnight-3
# continuity) and the four v2 hard bots: 216 games per evaluation.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"     # Elo, not a rate
downsample = 3                     # = [scoring].last_k points per trial
fixed_cost = true
max_suggestion_cost = 4.1e8
max_runs = 60                      # 7 params: 1 default + 12 Sobol + 47 GP
num_random_samples = 12
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "6G"                  # train.py peaked at 1.5 GB RSS, its evaluate.py child at 0.7 GB
nice = 10
max_seconds = 2400                 # a healthy trial is ~10 min
poll_seconds = 60

[scoring]
scorer = "league"
last_k = 3                         # eval_every 20M -> the last 60M steps
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8                        # the box is idle between trials
seed_base = 70001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
steps = 400000000
workers = 128
buffers = 4
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learner_passes = 4
learning_rate = 1.25e-3
entropy = 8e-3
entropy_floor = 0.001
entropy_half_life = 200000000
entropy_head_scale = "1,1.5,1"
entropy_free_rows = 1
reward_kill = 0.27
reward_timeout = -1
scripted_bots = ["evasive-v2", "mixed-v2", "pursuer-v2"]  # ordered candidates; scripted_banks takes the first N
scripted_level = "hard"
scripted_decay = 120000000
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 10000000
eval_every = 20000000
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

[params.learning_rate]
distribution = "log_normal"
min = 7e-4
max = 2.5e-3
scale = 0.5

[params.entropy]
distribution = "log_normal"
min = 3e-3                         # widened down: the aim head no longer soaks up the bonus
max = 1.4e-2
scale = 0.5

[params.entropy_half_life]
distribution = "log_normal"
min = 1e8                          # floor 1e-3 reached at ~300M
max = 4e8                          # one halving over the run
scale = 0.5
integer = true

[params.reward_kill]
distribution = "uniform"
min = 0.1                          # <= 0.05 gave no-offense trials in overnight-3
max = 0.5
scale = "auto"

[params.scripted_decay]
distribution = "log_normal"
min = 4e7                          # bot gone after 10% of the run
max = 3e8                          # still playing a quarter of its bank at the end
scale = 0.5
integer = true

[params.scripted_banks]
distribution = "int_uniform"
min = 1
max = 3                            # 4 banks total; at least one stays self-play
scale = "auto"
default = 1

[params.head_scale_aim]
distribution = "log_normal"
min = 0.03
max = 1.0                          # 1 = the old behaviour (aim head near-uniform for the whole run)
scale = 0.5
default = 0.15
