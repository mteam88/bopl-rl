# Overnight sweep 7 (2026-09-13, relaunched 17:0x): overnight-6's 1B protocol with the
# Fourier aim head and the Elo-matchmade scripted roster, with the optimizer owning
# the curriculum. Score: Bradley-Terry Elo vs pool v5 (unchanged; game_mismatch=true on
# every rating is informational, see overnight-5.toml), IQM over the last 3
# evaluations, 480 games per checkpoint.
#
# Fixed by evidence, not by hand: aim_fourier 4 (aim-head arm study, main fa60e0b,
# sweeps/aim-ar-fourier/report.md: K=4 beats absolute bins on every metric, K=1..4 a
# plateau, --aim-ar lost everywhere); w128 b4 hidden 128 (throughput); the 12-entry v2
# roster (search bots cut learner sps 84% as env-pool stragglers, see scripted_roster.py).
#
# Everything else is swept over wide boxes. The first launch of this sweep pinned
# scripted_banks = 1 (carried over from overnight-6's verdict under the old
# time-decayed fixed bot), boxed scripted_share_min below share_max's floor to dodge a
# validation error, and hand-narrowed lr/entropy/reward_kill/aim/half-life around
# overnight-6's cell. Its three finished trials (556 / 499 / 580 with banks=1) are kept
# in sweeps/overnight-7-banks1. Rules: the optimizer decides; a box edge is only ever a
# hard constraint (train.py validation, throughput), never a guess about the optimum.
#   scripted_banks 1..4  how many of the 4 banks draw from the roster; 4 at share 1 puts
#                        every bank match against a bot = 50% of all games. The other 50%
#                        are mirror self-play envs by rollout layout (native_vector pairs
#                        one self-play env with one bank env); making that split a knob
#                        is a layout change, queued, not a config edit.
#   scripted_share_max/min 0.02..1 each  the Elo-informativeness share and its floor;
#                        min > max is clamped to a constant share at max (train.py), so
#                        both span the full range.
#   learning_rate 1e-4..3e-3, entropy 4e-3..1e-1 (3e-3 collapsed in overnight-5: let the
#   GP see that edge), entropy_half_life 1e8..3e9, reward_kill 0.1..3, head_scale_aim
#   0.05..3.
# Trial 000 = overnight-6's 028 + aim_fourier 4 + banks 1 + share 0.15/0.02, i.e. the
# first launch's trial 000 (556), the one fixed point across sweeps.
#
# Budget: 21.5 min per trial measured (train 17 + score 4.5) -> 60 trials ~ 21.5 h.
# 8 params: 1 default + 12 Sobol + 47 GP.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"     # Elo, not a rate
downsample = 3                     # = [scoring].last_k points per trial
fixed_cost = true
max_suggestion_cost = 1.01e9
max_runs = 60                      # 8 params: 1 default + 12 Sobol + 47 GP, ~21.5 h
num_random_samples = 12
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "6G"
nice = 10
max_seconds = 4800                 # a healthy trial is ~21 min
poll_seconds = 60

[scoring]
scorer = "league"
last_k = 3                         # eval_every 40M -> the last 120M steps
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 70001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
steps = 1000000000
workers = 128
buffers = 4
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learner_passes = 4
aim_fourier = 4                    # the aim-head study's pick; 0 = absolute bins (overnight-1..6)
learning_rate = 5e-4
entropy = 2.48e-2
entropy_floor = 0.001
entropy_half_life = 447000000
entropy_head_scale = "0.41,1.5,1"
entropy_free_rows = 1
reward_kill = 0.52
reward_timeout = -1
scripted_roster = "default"        # 12 v2 kind-levels; search bots opt-in (84% sps hit)
scripted_banks = 1                 # trial-000 value; swept 1..4 below
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 20000000
eval_every = 40000000
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5

[params.entropy]
distribution = "log_normal"
min = 4e-3
max = 1e-1
scale = 0.5

[params.entropy_half_life]
distribution = "log_normal"
min = 1e8
max = 3e9
scale = 0.5
integer = true

[params.reward_kill]
distribution = "log_normal"
min = 0.1
max = 3.0
scale = 0.5

[params.scripted_banks]
distribution = "int_uniform"
min = 1
max = 4

[params.scripted_share_max]
distribution = "log_normal"
min = 0.02
max = 1.0
scale = 0.5
default = 0.15

[params.scripted_share_min]
distribution = "log_normal"
min = 0.02
max = 1.0
scale = 0.5
default = 0.02

[params.head_scale_aim]
distribution = "log_normal"
min = 0.05
max = 3.0
scale = 0.5
default = 0.41
