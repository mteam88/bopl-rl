# Overnight sweep 8 (queued 2026-09-13 behind overnight-7, retuned 2026-09-14 11:00
# from overnight-7's first 45 trials): overnight-7's search with the training budget
# itself swept, 1B..4B learner steps. overnight-7's Elo curves were still climbing
# at 1B, so 1B is a box edge we chose, not a plateau; the fixed point of every
# earlier sweep becomes a Protein axis with a real cost model.
# Score: Bradley-Terry Elo vs pool v6, IQM over the last 3 evaluations, 480 games per
# checkpoint. Pool v6 (2026-09-14) replaces v5 because v5 was confounded with the
# curriculum: 12 of its 19 references were scripted bots, four of them the v2 kinds
# that ARE the Elo-matchmade training roster, and its strongest learned anchor was
# ~430 Elo. overnight-7's share-1 trials beat the roster bots 90%+ and every learned
# anchor 75-95%, so ~100 of their Elo was "beats what it trained on" (041: 744 on v5,
# 648 refit without the v2 bots, 610 on checkpoints + search bots only) and the pool
# had no resolution above ~600 except through bots. v6 = v5 minus the four v2 bots
# plus six overnight-7 finals (041/035/033/007/016/000) as strong, stylistically
# varied anchors; a candidate is never rated against a member that is itself.
# Scores are not comparable to overnight-5..7's v5 numbers; overnight-7 is rescored
# on v6 into <trial>/reference/<v6 sha8>/.
#
# fixed_cost = false: Protein sees each trial as three (steps, score, cost) points
# (the last 3 rated checkpoints) and suggests steps like any other hyper, trading
# cost against expected score along the pareto front. Cost = learner steps, so a
# bot-heavy trial (slower sps) is not penalised for wall time; max_seconds only
# guards a hang. The driver log-stratifies the 12 Sobol trials over the steps box
# (cheap first) so the GP starts with cost-axis coverage (see driver.py).
#
# What overnight-7 taught (45 trials, best 733 = trial 041, previous ceiling ~600):
#   - banks 1 / share_max 1.0 / share_min at its floor wins: one bank always
#     matchmade against a roster bot (12.5% of games), never more banks (corr
#     banks -0.52, share_max +0.63, share_min -0.53). Two of those sit on box
#     edges: share_max 1.0 is a hard ceiling by definition; share_min 0.02 was
#     our floor, so it is opened to 0.002 here.
#   - head_scale_aim wants the floor (0.05, corr -0.46, the last 8 trials all at
#     0.05): opened to 0.005. Do not narrow the top; the GP already left it.
#   - entropy_half_life short (150..320M at 1B, corr -0.50), near our 1e8 floor:
#     opened to 3e7. The top stays 1e10 because a 4B run may want a slower
#     schedule than a 1B run; the optimizer decides.
#   - lr ~1e-3, reward_kill ~0.9, entropy ~0.02: mid-box, boxes unchanged.
# Trial 000 = overnight-7's 041 (733) at 1B: the fixed point, and a same-seed
# replicate of the best trial (the banks-1/share-1 cell spans 551..733 at
# near-identical hypers, so that replicate is also the noise-floor measurement).
#
# Cadence: eval_every 80M / checkpoint_every 20M. A 4B trial gets 50 in-run
# evaluations (100 at 40M would double the per-trial disk: 19 MB of mind logs per
# evaluation is the post-archive floor). last_k 3 -> the last 240M steps.
#
# Disk: /home is btrfs with compress=zstd:1, so a 1B trial's 2 GB apparent is
# ~0.7 GB on disk (compsize: the JSON/metrics compress 12x; the 19 MB-per-evaluation
# mind logs, checkpoints and pool are the incompressible 540 MB). 40 trials at ~2.5B
# ~ 70 GB real against 140 GB free at queue time. eval/compact_evaluations.py
# (json -> json.gz) exists for plain filesystems and gains nothing here.
#
# Budget: 1B ~18.5 min train+score (overnight-7), 4B ~70 min; expect ~45 min per
# trial on average -> 40 trials ~30 h. 9 params: 1 default + 12 Sobol + 27 GP.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"     # Elo, not a rate
downsample = 3                     # = [scoring].last_k points per trial
fixed_cost = false                 # steps is a swept axis; see [params.steps]
max_suggestion_cost = 4.05e9       # = params.steps.max (learner steps)
max_runs = 40                      # 9 params: 1 default + 12 Sobol + 27 GP, ~30 h
num_random_samples = 12
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "6G"
nice = 10
max_seconds = 12000                # 4B at overnight-7 013's pace is ~2.5 h; this only guards a hang
poll_seconds = 60

[scoring]
scorer = "league"
last_k = 3                         # eval_every 80M -> the last 240M steps
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 80001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
steps = 1000000000                 # trial-000 value; swept 1B..4B below
workers = 128
buffers = 4
banks = 4
seed = 73
encoder = "set"
hidden = 128
layers = 1
horizon = 128
learner_passes = 4
aim_fourier = 4                    # the aim-head study's pick; 0 = absolute bins (overnight-1..6)
learning_rate = 9.06e-4                # trial-000 = overnight-7 041
entropy = 2.01e-2
entropy_floor = 0.001
entropy_half_life = 166334326
entropy_head_scale = "0.05,1.5,1"
entropy_free_rows = 1
reward_kill = 0.909
reward_timeout = -1
scripted_roster = "default"        # 12 v2 kind-levels; search bots opt-in (84% sps hit)
scripted_banks = 1                 # trial-000 value; swept 1..4 below
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 20000000
eval_every = 80000000
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

[params.steps]
distribution = "log_normal"
min = 1000000000
max = 4000000000
scale = 0.5
integer = true

[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5

[params.entropy]
distribution = "log_normal"
min = 4e-3
max = 1e-1
scale = 0.5

[params.entropy_half_life]
distribution = "log_normal"
min = 3e7                          # overnight-7 sat at 150..320M against a 1e8 floor
max = 1e10
scale = 0.5
integer = true

[params.reward_kill]
distribution = "log_normal"
min = 0.1
max = 3.0
scale = 0.5

[params.scripted_banks]
distribution = "int_uniform"
min = 1
max = 4

[params.scripted_share_max]
distribution = "log_normal"
min = 0.02
max = 1.0                          # hard ceiling: a share is a probability
scale = 0.5
default = 1.0

[params.scripted_share_min]
distribution = "log_normal"
min = 0.002                        # overnight-7 pinned our 0.02 floor
max = 1.0
scale = 0.5
default = 0.0205

[params.head_scale_aim]
distribution = "log_normal"
min = 0.005                        # overnight-7 pinned our 0.05 floor
max = 3.0
scale = 0.5
default = 0.05
