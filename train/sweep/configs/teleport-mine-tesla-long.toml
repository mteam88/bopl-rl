# Long specialist: Teleport, Mine, Tesla coil: zone control.
# One of eight (2026-09-20, thread "generalized bots" thr_bam5xbkv6z; Matthew: "much longer
# specialist runs, we want a very strong and diverse pool"). The frozen recipe (v4-lite-aim:
# v4-lite shape, v4_ablate 10, w256 b4, LR 4.852e-4, seed 73) on one lineups-8 row, stretched
# to four times the 1x budget: 6939869184 learner steps (~4.5 h). Every step-denominated
# schedule is stretched with it (entropy half-life, checkpoint and evaluation spacing), so
# a checkpoint here at fraction f of training matches the 1x run's checkpoint at the same f.
# The pool-v8 score is the 2,4,14 slice and means little off that kit; the reading is the
# per-kit head-to-head (reference_pool.py rate) against the 1x specialist and the generalists.
# Flags not listed are layout.V4_DEFAULTS.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"
downsample = 3
fixed_cost = true
max_suggestion_cost = 7.0e9
max_runs = 1
num_random_samples = 1
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "10G"
nice = 0
max_seconds = 30000                # ~4.5 h expected; the cap is a safety net, not a budget
poll_seconds = 60

[scoring]
scorer = "reference"
pool = "native/artifacts/rl/sweeps/anchors/pool-v8/pool.json"
last_k = 3
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 80001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"

[fixed]
# policy v4 (POLICY_V4_PLAN.md), width 256, one MinGRU layer; shape flags below
encoder = "v4"
hidden = 256
layers = 1
v4_set_inner = 64
v4_ffn_dim = 0
v4_critic_dim = 384
v4_ablate = 10
# the loadout draw (this run)
loadout = [25, 24, 23]
# overnight-9 024, stretched 4x in steps and every step-denominated schedule
steps = 6939869184                 # 4 x 1734967296 (the 1x runs' realised step count)
workers = 256                      # b4 recipe (2026-09-19 16:xx, Matthew: adopt): 128 rows per buffer chain; notes-v4.md recipe table
buffers = 4
banks = 4
seed = 73
horizon = 128
learner_passes = 1                 # b4: two gradient steps of 24576 prio-drawn rows per 49152-row update (replay 1.0)
minibatch_div = 2
aim_fourier = 4
learning_rate = 0.0004852184640654399   # 3.431e-4 x sqrt(2) for the doubled batch (b2 gate: +50 band over the plain LR at w256)
entropy = 0.01532588085540654
entropy_floor = 0.001
entropy_half_life = 2874446584     # 4 x 718611646
entropy_head_scale = "0.028821467398601395,1.5,1"
entropy_free_rows = 1
reward_kill = 0.2883693237829292
reward_timeout = -1
scripted_roster = "default"
scripted_banks = 3
scripted_share_max = 1.0
scripted_share_min = 0.11048204896277423
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2]
evaluation_maps = [0, 1, 2]
heldout_maps = [3, 4]
episode_ticks = 7200
checkpoint_every = 80000000        # 4 x 20M: the same ~87 checkpoints per run
eval_every = 320000000             # 4 x 80M: the same ~22 evaluations per run
evaluation_games = 8
heldout_games = 4
evaluation_workers = 4
cudagraphs = 1

# sweep_config requires one swept parameter; at its default this is [fixed].learning_rate.
[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5
default = 0.0004852184640654399   # must equal [fixed].learning_rate: defaults() prefers this value (2026-09-20 fix; the b4 commit only changed [fixed])
