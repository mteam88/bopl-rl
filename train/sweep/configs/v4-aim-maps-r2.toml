# Policy v4, more maps round 2 (round 2): v4-aim-maps-r2
#   v4-aim (rays + aim/LOS, writer bit 8) trained on 41 of the 54-level catalogue
#   (native/data/map-set.json after round 2: RL 31-53 = 23 more grass levels);
#   held out: the round-1 eight plus five of round 2 (RL 36, 39, 42, 44, 53 =
#   levels 41, 47, 66, 74, 92), 13 in all. The sim is a STAGED build with the
#   54-map data (fixed.game), not the tree's library; maps 0-30 in it are
#   digest-identical to the tree's. Requires the 64-wide map mask / counters
#   (maps-round2 branch) in the trainer that runs it.
#   In-run evaluation: 12 training maps x 2 games (6 of each round), 13 held-out
#   maps x 2 games, every 80M steps. Everything else is v4-aim-maps verbatim.
# Flags not listed are layout.V4_DEFAULTS.

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
metric_distribution = "linear"
downsample = 3
fixed_cost = true
max_suggestion_cost = 1.75e9
max_runs = 1
num_random_samples = 1
use_gpu = false
cost = "learner_steps"
seeds = "fixed"
concurrency = 1

[trial]
memory_max = "10G"
nice = 0
max_seconds = 21600                # steps stay 1734936776 (the 024 budget); the comparison is at equal steps (every 20M checkpoint), not equal wall time, so full runs are wanted even at 3x
poll_seconds = 60

[scoring]
scorer = "league"
last_k = 3
games = 480
first_pass_games = 6
band = [0.15, 0.85]
round_games = 96
workers = 8
seed_base = 80001

[scoring.flags]
no-offense = "arrows_per_game < 0.05"
platform-spam = "platforms_per_game > 8"
stalemate = "timeout_rate > 0.5"
heldout-gap = "heldout_gap > 8"

[fixed]
# policy v4, width 256, one MinGRU layer; shape flags below
encoder = "v4"
hidden = 256
layers = 1
v4_ablate = 8
# overnight-9 024, verbatim
steps = 1734936776
workers = 128
buffers = 4
banks = 4
seed = 73
horizon = 128
learner_passes = 4
aim_fourier = 4
learning_rate = 0.0003431012662975937
entropy = 0.01532588085540654
entropy_floor = 0.001
entropy_half_life = 718611646
entropy_head_scale = "0.028821467398601395,1.5,1"
entropy_free_rows = 1
reward_kill = 0.2883693237829292
reward_timeout = -1
scripted_roster = "default"
scripted_banks = 3
scripted_share_max = 1.0
scripted_share_min = 0.11048204896277423
scripted_opponents = "mixed-hard,mixed-v2-hard,archer-v2-hard,pursuer-v2-hard,evasive-v2-hard"
training_maps = [0, 1, 2, 5, 6, 7, 9, 11, 12, 13, 14, 15, 16, 18, 20, 21, 22, 24, 25, 26, 27, 28, 30, 31, 32, 33, 34, 35, 37, 38, 40, 41, 43, 45, 46, 47, 48, 49, 50, 51, 52]
evaluation_maps = [0, 2, 7, 13, 18, 24, 31, 34, 38, 43, 47, 50]
heldout_maps = [3, 4, 8, 10, 17, 19, 23, 29, 36, 39, 42, 44, 53]
game = "/home/mte/.local/share/bopl-null-hypothesis/lib/maps-r2-54/libbopl_sim.so"
episode_ticks = 7200
checkpoint_every = 20000000
eval_every = 80000000
evaluation_games = 2
heldout_games = 2
evaluation_workers = 4
cudagraphs = 1

# sweep_config requires one swept parameter; at its default this is [fixed].learning_rate.
[params.learning_rate]
distribution = "log_normal"
min = 1e-4
max = 3e-3
scale = 0.5
default = 0.0003431012662975937
